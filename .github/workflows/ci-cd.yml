name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Tesseract (needed by the OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (upload validation, extraction, cleanup, config)
        run: pytest -m "not ocr" -v
      - name: OCR tests on generated mock PDFs
        run: pytest -m ocr -v -rs

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json   # commit the lockfile (npm install once locally)
      - run: npm ci
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Create CI .env (production mode; dummy key, the LLM is never called)"
        run: |
          {
            echo "ENVIRONMENT=production"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "ANTHROPIC_API_KEY=ci-dummy-key"
          } > .env
      - name: Validate compose files (production and local override)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose config -q
      - name: Build and boot the production stack (waits for health checks)
        run: docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx (UI, then API -> Postgres)
        run: |
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/api/patients
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-build, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image names (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=/api
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # Optional: trigger your host after images are published, e.g.
      # - run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
